name: Update profile stats

on:
  schedule:
    - cron: "0 3 * * *"          # every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/update-readme-stats.yml"
  workflow_dispatch:              # lets you trigger it manually from the Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: "username=Darkness0258&show_icons=true&theme=tokyonight&hide_border=true&count_private=true"
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: "username=Darkness0258&layout=compact&theme=tokyonight&hide_border=true"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=Darkness0258&theme=tokyonight&hide_border=true"
          path: profile/streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate trophy card
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Darkness0258
          output_path: profile/trophy.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update profile stats"
            git push
          fi
